[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Add your environment variables in Netlify dashboard
  # Settings > Environment variables

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"

# Redirect all requests to the index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Note: Next.js applications require server-side rendering support
# Consider using Vercel or other Next.js-compatible platforms for full functionality